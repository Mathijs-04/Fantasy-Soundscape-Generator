<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ambience Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --border: #e4e7ec; --text: #101828; --muted: #667085;
    --accent: #2563eb; --accent-hover: #1d4ed8; --danger: #dc2626; --off: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  main { max-width: 720px; margin: 24px auto; padding: 0 24px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 600; }
  .head span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .head span b { color: var(--text); font-weight: 600; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); background: transparent; display: block; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  #vibeTrack { height: 4px; border-radius: 2px; margin-bottom: 4px; }
  #vibeNote:empty { display: none; }
  .ends { position: relative; height: 20px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .ends span { position: absolute; top: 0; white-space: nowrap; }
  #endLo { transform: none; }
  #endHi { transform: translateX(-100%); }
  #vibeMsg { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--accent); opacity: 0; transition: opacity .3s; }
  #vibeMsg.show { opacity: 1; }
  .hint { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .hint #fxVal { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button:hover { background: var(--bg); }
  #play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 88px; }
  #play:hover { background: var(--accent-hover); }
  #play.playing { background: var(--card); border-color: var(--danger); color: var(--danger); }
  #play.playing:hover { background: #fef2f2; }
  #beds { margin-left: auto; font-size: 12px; color: var(--muted); }
  .log-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  pre { margin: 0; background: var(--bg); border: 1px solid var(--border); padding: 12px; height: 200px; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #344054; border-radius: 6px; }
</style>
</head>
<body>
<header><h1>Ambience Generator</h1></header>
<main>

<section>
  <div class="head"><label for="loc">Setting</label><span id="locVal"></span></div>
  <input type="range" id="loc" min="0" max="5" step="1" value="0">
  <div class="scale" id="locScale"></div>
</section>

<section>
  <div class="head"><label for="vibe">Danger level</label><span id="vibeVal"></span></div>
  <div id="vibeTrack"></div>
  <input type="range" id="vibe" min="0" max="1" step="0.01" value="0.2">
  <div class="ends"><span id="endLo"></span><span id="endHi"></span></div>
  <div class="scale" id="vibeNote"></div>
  <div id="vibeMsg"></div>
  <div class="hint"><span>Effects scale with danger</span><span id="fxVal"></span></div>
</section>

<section class="actions">
  <button id="play">Play</button>
  <div id="beds"></div>
</section>

<section>
  <div class="log-title">Activity log</div>
  <pre id="log"></pre>
</section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
